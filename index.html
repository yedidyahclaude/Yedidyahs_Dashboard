<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockView Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080f;--s1:#0c0d1a;--s2:#111220;--s3:#161728;
  --b1:#1c1d2e;--b2:#242538;
  --tx:#e0e1f0;--mu:#606172;--dim:#383950;
  --ac:#7c6aff;--ac2:#a78bfa;
  --gr:#19c48a;--rd:#f0506e;--gold:#f59e0b;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Mono',monospace;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* HEADER */
header{display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--b1);z-index:100}
.brand{display:flex;align-items:center;gap:7px;text-decoration:none;flex-shrink:0}
.bico{width:24px;height:24px;border-radius:5px;background:linear-gradient(135deg,var(--ac),#4488ff);display:flex;align-items:center;justify-content:center}
.bico svg{width:13px;height:13px}
.bnm{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#fff}
.bnm em{color:var(--ac2);font-style:normal}

/* SEARCH */
.sw{flex:1;max-width:340px;position:relative}
.sico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
#si{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:7px;color:var(--tx);font-family:'DM Mono',monospace;font-size:12px;padding:6px 28px 6px 29px;outline:none;transition:border-color .15s}
#si::placeholder{color:var(--mu)}
#si:focus{border-color:var(--ac)}
.sspin{position:absolute;right:8px;top:50%;width:11px;height:11px;border:2px solid var(--b2);border-top-color:var(--ac);border-radius:50%;animation:spin .5s linear infinite;display:none;transform:translateY(-50%)}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
#dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--s2);border:1px solid var(--b2);border-radius:8px;z-index:300;display:none;max-height:280px;overflow-y:auto;box-shadow:0 16px 40px #00000077}
#dd.open{display:block}
#dd::-webkit-scrollbar{width:3px}
#dd::-webkit-scrollbar-thumb{background:var(--b2)}
.dlb{font-size:8px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px 4px;position:sticky;top:0;background:var(--s2)}
.dit{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;cursor:pointer;border:none;background:none;width:100%;font-family:'DM Mono',monospace;transition:background .08s}
.dit:hover{background:#7c6aff0e}
.dil{display:flex;align-items:center;gap:7px}
.dsy{font-size:12px;font-weight:500;color:#fff;min-width:55px;text-align:left}
.dna{font-size:10px;color:var(--mu);text-align:left}

/* HEADER RIGHT */
.hright{display:flex;align-items:center;gap:10px;margin-left:auto}
.sess{font-size:9px;padding:2px 7px;border-radius:9px;font-weight:600;letter-spacing:.04em}
.sess.pre{background:#f59e0b12;color:var(--gold);border:1px solid #f59e0b25}
.sess.mkt{background:#19c48a12;color:var(--gr);border:1px solid #19c48a25}
.sess.aft{background:#a78bfa12;color:var(--ac2);border:1px solid #a78bfa25}
.sess.cls{background:var(--b1);color:var(--mu);border:1px solid var(--b2)}
.htime{font-size:10px;color:var(--mu)}

/* ADD WIDGET BUTTON */
.add-widget-btn{display:flex;align-items:center;gap:5px;background:var(--ac);border:none;border-radius:6px;color:#fff;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.04em;padding:5px 10px;cursor:pointer;transition:opacity .12s}
.add-widget-btn:hover{opacity:.85}
.widget-menu{position:absolute;top:calc(100% + 4px);right:0;background:var(--s2);border:1px solid var(--b2);border-radius:8px;z-index:200;min-width:160px;box-shadow:0 16px 40px #00000077;display:none}
.widget-menu.open{display:block}
.wm-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border:none;background:none;width:100%;font-family:'DM Mono',monospace;font-size:11px;color:var(--tx);transition:background .08s}
.wm-item:hover{background:#7c6aff0e}
.wm-item span{font-size:14px}
.wm-wrap{position:relative}

/* TAPE */
.tape{height:24px;background:var(--s1);border-bottom:1px solid var(--b1);overflow:hidden;flex-shrink:0;position:relative}
.tape::before,.tape::after{content:'';position:absolute;top:0;bottom:0;width:30px;z-index:2;pointer-events:none}
.tape::before{left:0;background:linear-gradient(to right,var(--s1),transparent)}
.tape::after{right:0;background:linear-gradient(to left,var(--s1),transparent)}
.ttr{display:flex;align-items:center;height:100%;animation:tsc 55s linear infinite;width:max-content}
.tape:hover .ttr{animation-play-state:paused}
@keyframes tsc{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti{display:flex;align-items:center;gap:5px;padding:0 12px;cursor:pointer;height:100%;white-space:nowrap}
.ti:hover{background:#ffffff05}
.tsy{font-size:9px;font-weight:500;color:#999}
.tpx{font-size:9px;color:var(--tx)}
.tpc{font-size:8px}
.tsp{width:1px;height:9px;background:var(--b1);flex-shrink:0}

/* GRID CANVAS */
.canvas{flex:1;overflow:auto;position:relative;background:var(--bg)}
.canvas::-webkit-scrollbar{width:5px;height:5px}
.canvas::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
#grid{position:relative;min-width:100%;min-height:100%}

/* WIDGETS */
.widget{
  position:absolute;
  background:var(--s1);
  border:1px solid var(--b1);
  border-radius:8px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-width:180px;
  min-height:120px;
  box-shadow:0 2px 20px #00000040;
  transition:box-shadow .15s;
}
.widget:hover{box-shadow:0 4px 30px #00000066}
.widget.dragging{box-shadow:0 8px 40px #0000009a;opacity:.95;z-index:1000}
.widget.resizing{z-index:1000}

/* WIDGET HEADER */
.wh{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--s2);border-bottom:1px solid var(--b1);cursor:grab;user-select:none;flex-shrink:0}
.wh:active{cursor:grabbing}
.wh-title{font-size:10px;font-weight:500;color:var(--tx);letter-spacing:.03em;flex:1}
.wh-badge{font-size:8px;background:var(--b2);color:var(--mu);padding:1px 5px;border-radius:6px}
.wh-btn{background:none;border:none;cursor:pointer;color:var(--mu);font-size:11px;padding:1px 4px;border-radius:3px;transition:all .1s;line-height:1}
.wh-btn:hover{color:var(--tx);background:var(--b2)}

/* WIDGET BODY */
.wb{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px}
.wb::-webkit-scrollbar{width:3px}
.wb::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* RESIZE HANDLE */
.resize-br{position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:se-resize;z-index:10}
.resize-br::after{content:'';position:absolute;bottom:3px;right:3px;width:6px;height:6px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);border-radius:0 0 2px 0}
.resize-br:hover::after{border-color:var(--ac)}

/* WATCHLIST */
.wla{display:flex;gap:5px;margin-bottom:7px}
.wla input{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:5px;color:var(--tx);font-family:'DM Mono',monospace;font-size:11px;padding:4px 7px;outline:none}
.wla input:focus{border-color:var(--ac)}
.wla button{background:var(--ac);border:none;border-radius:5px;color:#fff;font-size:14px;width:24px;cursor:pointer;flex-shrink:0;line-height:1}
.wi{display:flex;align-items:center;justify-content:space-between;padding:5px 6px;border-radius:4px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;transition:background .08s}
.wi:hover{background:var(--s2);border-color:var(--b2)}
.wi.ac{background:#7c6aff0c;border-color:#7c6aff28}
.wil{display:flex;flex-direction:column;gap:1px;min-width:0}
.wis{font-size:11px;font-weight:500;color:#ddd;white-space:nowrap}
.wi.ac .wis{color:var(--ac2)}
.win{font-size:8px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.wir{text-align:right;flex-shrink:0;margin-left:6px}
.wip{font-size:11px;color:var(--tx)}
.wic{font-size:9px;margin-top:1px}
.wid{opacity:0;font-size:9px;color:var(--rd);background:none;border:none;cursor:pointer;margin-left:3px}
.wi:hover .wid{opacity:.5}
.wid:hover{opacity:1!important}

/* ALERTS */
.alf{background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:8px;margin-bottom:8px}
.alf select,.alf input{width:100%;background:var(--s3);border:1px solid var(--b2);border-radius:4px;color:var(--tx);font-family:'DM Mono',monospace;font-size:10px;padding:4px 6px;outline:none;margin-bottom:4px}
.alf select option{background:#111}
.alcr{width:100%;background:var(--ac);border:none;border-radius:4px;color:#fff;font-family:'DM Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.05em;padding:5px;cursor:pointer}
.ali{display:flex;align-items:center;justify-content:space-between;padding:5px 6px;background:var(--s2);border:1px solid var(--b2);border-radius:4px;margin-bottom:3px}
.alil{display:flex;align-items:center;gap:5px}
.ald{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.ald.on{background:var(--gr);animation:pu 2s ease-in-out infinite}
.ald.off{background:var(--dim)}
.ald.trig{background:var(--gold)}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.als{font-size:10px;font-weight:500;color:var(--ac2)}
.alx{background:none;border:none;color:var(--rd);opacity:.4;cursor:pointer;font-size:10px}
.alx:hover{opacity:1}

/* PORTFOLIO */
.psum{background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:8px;margin-bottom:8px}
.psr{display:flex;justify-content:space-between;margin-bottom:2px}
.psr:last-child{margin-bottom:0}
.psl{font-size:8px;color:var(--mu);letter-spacing:.05em;text-transform:uppercase}
.psv{font-size:11px;color:var(--tx)}
.padd{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.padd input{background:var(--s2);border:1px solid var(--b2);border-radius:4px;color:var(--tx);font-family:'DM Mono',monospace;font-size:10px;padding:4px 6px;outline:none}
.padd input:focus{border-color:var(--ac)}
.padd button{background:var(--gr);border:none;border-radius:4px;color:#000;font-family:'DM Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em;padding:5px;cursor:pointer}
.poi{padding:6px;background:var(--s2);border:1px solid var(--b2);border-radius:4px;margin-bottom:3px}
.pot{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.pos2{font-size:10px;font-weight:500;color:#ddd}
.poq{font-size:8px;color:var(--mu)}
.pop{font-size:10px}
.pob{display:flex;justify-content:space-between}
.poa{font-size:8px;color:var(--mu)}
.poc{font-size:8px;color:var(--tx)}

/* NEWS */
.ni{padding:7px;background:var(--s2);border:1px solid var(--b2);border-radius:5px;margin-bottom:4px;cursor:pointer;text-decoration:none;display:block;transition:border-color .1s}
.ni:hover{border-color:var(--ac)}
.nisym{font-size:8px;color:var(--ac2);margin-bottom:2px;font-weight:500}
.nitl{font-size:10px;color:var(--tx);line-height:1.4;margin-bottom:2px}
.nitm{font-size:8px;color:var(--mu)}
.nisen{display:inline-block;font-size:7px;padding:1px 3px;border-radius:3px;margin-left:2px}
.nisen.p{background:#19c48a15;color:var(--gr)}
.nisen.n{background:#f0506e15;color:var(--rd)}
.nisen.u{background:var(--b2);color:var(--mu)}
.nlod{font-size:10px;color:var(--mu);text-align:center;padding:14px 0}

/* SCANNER */
.scan-filters{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px}
.flt-g{display:flex;flex-direction:column;gap:2px}
.flt-l{font-size:7px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.flt-i{background:var(--s3);border:1px solid var(--b2);border-radius:4px;color:var(--tx);font-family:'DM Mono',monospace;font-size:10px;padding:4px 6px;outline:none;width:100%}
.flt-i:focus{border-color:var(--ac)}
.scan-btn-row{display:flex;gap:5px;margin-bottom:7px}
.scan-btn{background:var(--ac);border:none;border-radius:4px;color:#fff;font-family:'DM Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.05em;padding:5px 8px;cursor:pointer;flex:1}
.scan-btn:disabled{opacity:.4;cursor:not-allowed}
.scan-btn.sec{background:var(--s2);border:1px solid var(--b2);color:var(--mu);flex:0}
.scan-syms{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px}
.scan-tag{display:inline-flex;align-items:center;gap:2px;background:var(--s2);border:1px solid var(--b2);border-radius:10px;padding:2px 6px;font-size:9px;color:var(--mu)}
.scan-tag.wl{background:#7c6aff12;border-color:#7c6aff28;color:var(--ac2)}
.scan-tag button{background:none;border:none;color:var(--rd);cursor:pointer;font-size:9px;opacity:.5;line-height:1}
.scan-add{display:flex;gap:4px;margin-bottom:7px}
.scan-add input{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:4px;color:var(--tx);font-family:'DM Mono',monospace;font-size:10px;padding:4px 6px;outline:none}
.scan-add input:focus{border-color:var(--ac)}
.scan-add button{background:var(--ac);border:none;border-radius:4px;color:#fff;font-size:12px;width:22px;cursor:pointer}
.scan-row{display:flex;align-items:center;gap:4px;padding:5px 4px;border-bottom:1px solid #1a1b2a;cursor:pointer;transition:background .08s}
.scan-row:hover{background:#7c6aff08}
.scan-sym{font-size:10px;font-weight:500;flex:1;min-width:0}
.scan-px{font-size:10px;width:42px;text-align:right}
.scan-chg{font-size:9px;width:38px;text-align:right}
.scan-pills{display:flex;gap:2px;width:70px;justify-content:center}
.pill{width:14px;height:14px;border-radius:50%;font-size:7px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pill.pass{background:#19c48a20;color:var(--gr);border:1px solid #19c48a40}
.pill.fail{background:#f0506e15;color:var(--rd);border:1px solid #f0506e30}
.pill.na{background:var(--b2);color:var(--mu)}
.scan-score{font-size:8px;padding:1px 4px;border-radius:6px;font-weight:600;width:22px;text-align:center}
.s5{background:#19c48a20;color:var(--gr)}
.s4{background:#f59e0b15;color:var(--gold)}
.s3{background:#7c6aff15;color:var(--ac2)}
.s0{background:var(--b2);color:var(--mu)}
.scan-empty{text-align:center;padding:20px;color:var(--mu);font-size:10px}

.up{color:var(--gr)}.dn{color:var(--rd)}

/* SNAP GRID OVERLAY */
.grid-snap{pointer-events:none;position:absolute;inset:0;z-index:0}

/* WIDGET PINNED */
.widget.pinned .wh{cursor:default}
.widget.pinned .resize-br{display:none}
.pin-indicator{font-size:9px;color:var(--gold);opacity:.7}

/* SETTINGS PANEL */
.ws-panel{position:absolute;top:32px;right:0;background:var(--s2);border:1px solid var(--b2);border-radius:7px;z-index:200;min-width:180px;box-shadow:0 8px 30px #00000077;display:none;padding:10px}
.ws-panel.open{display:block;animation:ddi .12s ease}
@keyframes ddi{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.ws-row{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.ws-label{font-size:8px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.ws-input{background:var(--s3);border:1px solid var(--b2);border-radius:4px;color:var(--tx);font-family:'DM Mono',monospace;font-size:11px;padding:4px 7px;outline:none;width:100%}
.ws-input:focus{border-color:var(--ac)}
.ws-select{background:var(--s3);border:1px solid var(--b2);border-radius:4px;color:var(--tx);font-family:'DM Mono',monospace;font-size:10px;padding:4px 6px;outline:none;width:100%}
.ws-select option{background:#111}
.ws-toggle{display:flex;align-items:center;justify-content:space-between;padding:5px 0;cursor:pointer}
.ws-toggle-label{font-size:10px;color:var(--tx)}
.ws-toggle-btn{width:28px;height:15px;border-radius:8px;background:var(--b2);border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.ws-toggle-btn::after{content:'';position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--mu);transition:all .2s}
.ws-toggle-btn.on{background:var(--ac)}
.ws-toggle-btn.on::after{left:15px;background:#fff}
.ws-save{width:100%;background:var(--ac);border:none;border-radius:4px;color:#fff;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.05em;padding:6px;cursor:pointer;margin-top:4px}
.ws-save:hover{opacity:.85}
.ws-danger{width:100%;background:none;border:1px solid var(--rd);border-radius:4px;color:var(--rd);font-family:'DM Mono',monospace;font-size:10px;padding:5px;cursor:pointer;margin-top:4px;transition:all .1s}
.ws-danger:hover{background:var(--rd);color:#fff}
@keyframes fg{0%{color:var(--gr)}100%{color:inherit}}
@keyframes fr{0%{color:var(--rd)}100%{color:inherit}}
.fu{animation:fg .7s ease}.fd{animation:fr .7s ease}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <a class="brand" href="#">
      <div class="bico">
        <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,12 5,7 8,10 12,4 15,6"/></svg>
      </div>
      <span class="bnm">Stock<em>View</em></span>
    </a>

    <div class="sw">
      <span class="sico"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input id="si" type="text" placeholder="Search any stock…" autocomplete="off" spellcheck="false"/>
      <div class="sspin" id="sspin"></div>
      <div id="dd"></div>
    </div>

    <div class="hright">
      <div class="wm-wrap">
        <button class="add-widget-btn" id="addWidgetBtn">+ Add Widget</button>
        <div class="widget-menu" id="widgetMenu">
          <button class="wm-item" onclick="addWidget('watchlist')"><span>📋</span> Watchlist</button>
          <button class="wm-item" onclick="addWidget('scanner')"><span>🔥</span> 5 Pillars Scanner</button>
          <button class="wm-item" onclick="addWidget('alerts')"><span>🔔</span> Alerts</button>
          <button class="wm-item" onclick="addWidget('portfolio')"><span>💼</span> Portfolio</button>
          <button class="wm-item" onclick="addWidget('news')"><span>📰</span> News</button>
        </div>
      </div>
      <span class="htime" id="htime"></span>
      <span class="sess cls" id="sessbdg">CLOSED</span>
    </div>
  </header>

  <!-- TAPE -->
  <div class="tape"><div class="ttr" id="ttr"></div></div>

  <!-- GRID CANVAS -->
  <div class="canvas" id="canvas">
    <div id="grid"></div>
  </div>
</div>

<script>
const FHK = 'd8gla1pr01qlgcuk91o0d8gla1pr01qlgcuk91og';
const DEFAULT_WL = ['AAPL','NVDA','TSLA','MSFT','AMZN','SPY','QQQ','META'];

const Q    = {};
let CUR    = localStorage.getItem('sv_s') || 'AAPL';
let wl     = JSON.parse(localStorage.getItem('sv_wl') || JSON.stringify(DEFAULT_WL));
let alts   = JSON.parse(localStorage.getItem('sv_al') || '[]');
let pos    = JSON.parse(localStorage.getItem('sv_pt') || '[]');
let scanSyms = JSON.parse(localStorage.getItem('sv_scan') || '[]');
let srt=null, hlt=-1, flt=[];
let fhWS=null;

function getScanSyms(){ return [...new Set([...wl,...scanSyms])]; }
function saveScanSyms(){ localStorage.setItem('sv_scan',JSON.stringify(scanSyms)); }
function fmtP(p){ return p?parseFloat(p).toFixed(2):'—'; }
function fmtV(n){ if(!n||n<1)return'—'; if(n>=1e9)return(n/1e9).toFixed(1)+'B'; if(n>=1e6)return(n/1e6).toFixed(1)+'M'; if(n>=1e3)return(n/1e3).toFixed(1)+'K'; return''+n; }

// ── CLOCK
function tick(){
  const et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const p=n=>String(n).padStart(2,'0');
  document.getElementById('htime').textContent=`${p(et.getHours())}:${p(et.getMinutes())}:${p(et.getSeconds())} ET`;
  const m=et.getHours()*60+et.getMinutes(),d=et.getDay();
  const el=document.getElementById('sessbdg');

// ── PRICES
async function fetchQ(sym){
  try{
    const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${FHK}`);
    const q=await r.json(); if(!q.c)return;
    const pr=await fetch(`https://finnhub.io/api/v1/stock/profile2?symbol=${sym}&token=${FHK}`);
    const p=await pr.json();
    Q[sym]={symbol:sym,price:q.c,open:q.o,high:q.h,low:q.l,
      prevClose:q.pc,change:q.c-q.pc,changePct:q.pc?(q.c-q.pc)/q.pc*100:0,
      volume:0,name:p.name||sym};
  }catch(e){}
}

function connectFinnhubWS(){
  try{
    fhWS=new WebSocket(`wss://ws.finnhub.io?token=${FHK}`);
    fhWS.onopen=()=>{
      wl.forEach(s=>fhWS.send(JSON.stringify({type:'subscribe',symbol:s})));
      console.log('✅ Finnhub WS connected');
    };
    fhWS.onmessage=e=>{
      const msg=JSON.parse(e.data);
      if(msg.type==='trade'&&msg.data){
        msg.data.forEach(t=>{
          const sym=t.s,px=t.p;
          if(!Q[sym])return;
          const prev=Q[sym].prevClose||px;
          Q[sym]={...Q[sym],price:px,change:px-prev,changePct:prev?(px-prev)/prev*100:0,
            high:Math.max(Q[sym].high||px,px),low:Math.min(Q[sym].low||px,px)};
          buildTape();refreshAllWidgets(sym);
        });
      }
    };
    fhWS.onclose=()=>setTimeout(connectFinnhubWS,5000);
    fhWS.onerror=()=>fhWS.close();
  }catch(e){}
}

async function refreshPrices(){
  for(const sym of [...new Set([...wl,CUR])]){
    await fetchQ(sym);
    buildTape();refreshAllWidgets(sym);
    await new Promise(r=>setTimeout(r,250));
  }
}

}

function checkAlerts(){
  let changed=false;
  alts.forEach(a=>{
    if(!a.active||a.triggered)return;
    const q=Q[a.sym];if(!q)return;
    let hit=false;
    if(a.type==='Price Above'&&q.price>=a.val)hit=true;
    if(a.type==='Price Below'&&q.price<=a.val)hit=true;
    if(a.type==='% Change Up'&&(q.changePct||0)>=a.val)hit=true;
    if(a.type==='% Change Down'&&(q.changePct||0)<=-a.val)hit=true;
    if(hit){
      a.triggered=true;changed=true;
      if(Notification.permission==='granted')new Notification(`🔔 ${a.sym}`,{body:`${a.type} ${a.val}${a.type.includes('%')?'%':''} triggered`});
    }
  });
  if(changed){saveAL();widgets.filter(w=>w.type==='alerts').forEach(w=>{const b=document.getElementById('wb-'+w.id);if(b)renderAL(b);});}
}

async function renderNews(body,sym){
  body.innerHTML='<div class="nlod">Loading…</div>';
  try{
    const today=new Date().toISOString().split('T')[0];
    const from=new Date(Date.now()-3*86400000).toISOString().split('T')[0];
    let r=await fetch(`https://finnhub.io/api/v1/company-news?symbol=${sym}&from=${from}&to=${today}&token=${FHK}`);
    let items=await r.json();
    if(!items?.length){r=await fetch(`https://finnhub.io/api/v1/news?category=general&token=${FHK}`);items=await r.json();}
    if(!items?.length){body.innerHTML='<div class="nlod">No news</div>';return;}
    body.innerHTML=items.slice(0,20).map(n=>{
      const age=timeAgo(new Date(n.datetime*1000));
      const s=n.sentiment>0.1?'p':n.sentiment<-0.1?'n':'u';
      const sl=n.sentiment>0.1?'▲':n.sentiment<-0.1?'▼':'●';
      return `<a class="ni" href="${n.url}" target="_blank" rel="noopener">
        <div class="nisym">${n.related||sym}<span class="nisen ${s}">${sl}</span></div>
        <div class="nitl">${(n.headline||'').slice(0,90)}${(n.headline||'').length>90?'…':''}</div>
        <div class="nitm">${age} · ${n.source||''}</div>
      </a>`;
    }).join('');
  }catch(e){body.innerHTML='<div class="nlod">News unavailable</div>';}
}

function timeAgo(d){
  const s=Math.floor((Date.now()-d)/1000);
  if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';
}

async function runScan(bid){
  const btn=document.getElementById('scanBtn-'+bid);
  if(btn){btn.disabled=true;btn.textContent='⏳ Scanning…';}
  const res=document.getElementById('scan-res-'+bid);
  if(res)res.innerHTML='<div class="scan-empty">Checking symbols…</div>';
  const minP=parseFloat(document.getElementById('fp-minp-'+bid)?.value)||1;
  const maxP=parseFloat(document.getElementById('fp-maxp-'+bid)?.value)||20;
  const minC=parseFloat(document.getElementById('fp-chg-'+bid)?.value)||10;
  const minRV=parseFloat(document.getElementById('fp-rv-'+bid)?.value)||5;
  const results=[];
  for(const sym of getScanSyms()){
    try{
      if(!Q[sym])await fetchQ(sym);
      const q=Q[sym];if(!q?.price)continue;
      const p1=q.price>=minP&&q.price<=maxP;
      const p2=(q.changePct||0)>=minC;
      if(!p1||!p2)continue;
      let hasNews=false;
      try{
        const today=new Date().toISOString().split('T')[0];
        const from=new Date(Date.now()-2*86400000).toISOString().split('T')[0];
        const r=await fetch(`https://finnhub.io/api/v1/company-news?symbol=${sym}&from=${from}&to=${today}&token=${FHK}`);
        const news=await r.json();hasNews=Array.isArray(news)&&news.length>0;
      }catch(e){}
      let rVol=null,float=null;
      try{
        const r=await fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${sym}&metric=all&token=${FHK}`);
        const d=await r.json();
        const avgV=(d.metric?.['10DayAverageTradingVolume']||0)*1000000;
        rVol=avgV>0?q.volume/avgV:null;
        float=d.metric?.['float']||null;
      }catch(e){}
      const p3=hasNews;
      const p4=rVol!==null?rVol>=minRV:null;
      const p5=float!==null?float<10:null;
      const score=[p1,p2,p3,p4===true,p5===true].filter(Boolean).length;
      results.push({sym,q,p1,p2,p3,p4,p5,score,hasNews});
    }catch(e){}
    await new Promise(r=>setTimeout(r,150));
  }
  results.sort((a,b)=>b.score-a.score||(b.q.changePct||0)-(a.q.changePct||0));
  if(res){
    if(!results.length){res.innerHTML='<div class="scan-empty">No stocks passed criteria<br>Try adjusting filters</div>';}
    else{
      res.innerHTML=`<div style="font-size:7px;color:var(--dim);display:flex;gap:4px;padding:3px 4px;letter-spacing:.06em">
        <span style="flex:1">SYM</span><span style="width:42px;text-align:right">PRICE</span>
        <span style="width:36px;text-align:right">CHG%</span>
        <span style="width:70px;text-align:center">PILLARS</span>
        <span style="width:22px;text-align:center">SCR</span>
      </div>`+results.map(r=>{
        const u=(r.q.changePct||0)>=0;
        const sc=r.score>=4?'s5':r.score===3?'s4':r.score>=2?'s3':'s0';
        const pd=v=>v===true?'pass':v===false?'fail':'na';
        return `<div class="scan-row" onclick="openTVPopup('${r.sym}')">
          <span class="scan-sym ${r.score>=4?'up':''}">${r.sym}${r.hasNews?' 🔥':''}</span>
          <span class="scan-px">$${fmtP(r.q.price)}</span>
          <span class="scan-chg ${u?'up':'dn'}">${u?'+':''}${(r.q.changePct||0).toFixed(1)}%</span>
          <div class="scan-pills">
            <span class="pill ${pd(r.p1)}" title="Price">P1</span>
            <span class="pill ${pd(r.p2)}" title="% Change">P2</span>
            <span class="pill ${pd(r.p3)}" title="News">P3</span>
            <span class="pill ${pd(r.p4)}" title="RVol">P4</span>
            <span class="pill ${pd(r.p5)}" title="Float">P5</span>
          </div>
          <span class="scan-score ${sc}">${r.score}/5</span>
        </div>`;
      }).join('');
    }
  }
  if(btn){btn.disabled=false;btn.textContent='▶ RUN SCANNER';}
}

// ── WIDGET SETTINGS
function toggleSettings(id,e){
  e.stopPropagation();
  const panel=document.getElementById('wsp-'+id);
  if(!panel)return;
  document.querySelectorAll('.ws-panel.open').forEach(p=>{if(p.id!=='wsp-'+id)p.classList.remove('open');});
  panel.classList.toggle('open');
}

function togglePin(id){
  const w=widgets.find(w=>w.id===id);if(!w)return;
  w.pinned=!w.pinned;
  const btn=document.getElementById('wsp-pin-'+id);
  if(btn)btn.classList.toggle('on',w.pinned);
  const el=document.getElementById(id);
  if(el)el.classList.toggle('pinned',w.pinned);
  saveWidgets();
}

function saveWidgetSettings(id){
  const w=widgets.find(w=>w.id===id);if(!w)return;
  const newLabel=document.getElementById('wsl-'+id)?.value.trim();
  const newType=document.getElementById('wst-'+id)?.value;
  if(newLabel)w.label=newLabel;
  const typeChanged=newType&&newType!==w.type;
  if(typeChanged)w.type=newType;
  saveWidgets();
  // Re-render widget
  const el=document.getElementById(id);
  if(el){
    el.innerHTML=widgetHTML(w);
    makeDraggable(el,w);makeResizable(el,w);
    populateWidget(el,w);
    if(w.pinned)el.classList.add('pinned');
  }
  document.querySelectorAll('.ws-panel').forEach(p=>p.classList.remove('open'));
}

// Close settings when clicking outside
document.addEventListener('click',()=>{
  document.querySelectorAll('.ws-panel.open').forEach(p=>p.classList.remove('open'));
});

const SNAP=20; // snap to 20px grid

// ── DRAG & DROP
function makeDraggable(el,wData){
  const hdr=el.querySelector('.wh');
  let ox=0,oy=0,sx=0,sy=0,dragging=false;
  hdr.addEventListener('mousedown',e=>{
    if(e.target.tagName==='BUTTON')return;
    if(wData.pinned)return;
    dragging=true;
    sx=e.clientX;sy=e.clientY;
    ox=wData.x;oy=wData.y;
    el.classList.add('dragging');
    el.style.zIndex=1000;
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    const rx=Math.max(0,ox+dx);
    const ry=Math.max(0,oy+dy);
    wData.x=Math.round(rx/SNAP)*SNAP;
    wData.y=Math.round(ry/SNAP)*SNAP;
    el.style.left=wData.x+'px';
    el.style.top=wData.y+'px';
  });
  document.addEventListener('mouseup',()=>{
    if(!dragging)return;
    dragging=false;
    el.classList.remove('dragging');
    el.style.zIndex='';
    saveWidgets();
  });
  // Touch support
  hdr.addEventListener('touchstart',e=>{
    if(e.target.tagName==='BUTTON')return;
    dragging=true;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    ox=wData.x;oy=wData.y;
    el.classList.add('dragging');
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    wData.x=Math.max(0,ox+dx);wData.y=Math.max(0,oy+dy);
    el.style.left=wData.x+'px';el.style.top=wData.y+'px';
  },{passive:true});
  document.addEventListener('touchend',()=>{if(!dragging)return;dragging=false;el.classList.remove('dragging');saveWidgets();});
}

function makeResizable(el,wData){
  const handle=el.querySelector('.resize-br');
  let resizing=false,sx=0,sy=0,ow=0,oh=0;
  handle.addEventListener('mousedown',e=>{
    if(wData.pinned)return;
    resizing=true;sx=e.clientX;sy=e.clientY;ow=wData.w;oh=wData.h;
    el.classList.add('resizing');e.preventDefault();e.stopPropagation();
  });
  document.addEventListener('mousemove',e=>{
    if(!resizing)return;
    const rw=Math.max(180,ow+(e.clientX-sx));
    const rh=Math.max(120,oh+(e.clientY-sy));
    wData.w=Math.round(rw/SNAP)*SNAP;
    wData.h=Math.round(rh/SNAP)*SNAP;
    el.style.width=wData.w+'px';el.style.height=wData.h+'px';
  });
  document.addEventListener('mouseup',()=>{
    if(!resizing)return;resizing=false;el.classList.remove('resizing');saveWidgets();
  });
}

// ── SEARCH
const inp=document.getElementById('si');
const dd=document.getElementById('dd');
const spin=document.getElementById('sspin');

async function doSearch(q){
  spin.style.display='block';
  try{
    const r=await fetch(`https://finnhub.io/api/v1/search?q=${encodeURIComponent(q)}&token=${FHK}`);
    const d=await r.json();
    flt=(d.result||[]).filter(x=>x.symbol&&x.symbol.length<=10&&!x.symbol.includes('/')
      &&(x.type==='Common Stock'||x.type==='ETP'||x.type==='ADR'||x.type==='DR'||x.type===''))
      .sort((a,b)=>a.symbol.length-b.symbol.length).slice(0,10);
    renderDrop('Results for "'+q+'"',flt);
  }catch(e){dd.innerHTML='<div style="padding:10px;font-size:11px;color:var(--mu);text-align:center">Search error</div>';}
  spin.style.display='none';dd.classList.add('open');
}

function showPop(){
  flt=wl.map(s=>({symbol:s,description:Q[s]?.name||s}));
  renderDrop('Watchlist',flt);dd.classList.add('open');
}

function renderDrop(lbl,items){
  if(!items.length){dd.innerHTML='<div style="padding:10px;font-size:11px;color:var(--mu);text-align:center">No results</div>';return;}
  dd.innerHTML=`<div class="dlb">${lbl}</div>`+items.map((it,i)=>{
    const s=it.symbol,q=Q[s],u=q?(q.changePct||0)>=0:true;
    return `<button class="dit" onclick="selectSym('${s}')" data-i="${i}">
      <div class="dil"><span class="dsy">${s}</span><span class="dna">${it.description||''}</span></div>
      ${q?`<span class="${u?'up':'dn'}" style="font-size:10px">${u?'+':''}${(q.changePct||0).toFixed(2)}%</span>`:''}
    </button>`;
  }).join('');
  hlt=-1;
}

function closeDrop(){dd.classList.remove('open');hlt=-1;}
inp.addEventListener('input',e=>{
  const v=e.target.value.trim();clearTimeout(srt);
  if(!v){showPop();return;}
  spin.style.display='block';
  srt=setTimeout(()=>doSearch(v),350);
});
inp.addEventListener('focus',()=>{if(!inp.value.trim())showPop();});
inp.addEventListener('keydown',e=>{
  const its=dd.querySelectorAll('.dit');
  if(e.key==='ArrowDown'){e.preventDefault();hlt=Math.min(hlt+1,its.length-1);its.forEach((x,i)=>x.classList.toggle('hl',i===hlt));}
  else if(e.key==='ArrowUp'){e.preventDefault();hlt=Math.max(hlt-1,0);its.forEach((x,i)=>x.classList.toggle('hl',i===hlt));}
  else if(e.key==='Enter'){const p=flt[hlt>=0?hlt:0];if(p){selectSym(p.symbol);closeDrop();}}
  else if(e.key==='Escape'){closeDrop();inp.blur();}
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.sw'))closeDrop();
  if(!e.target.closest('.wm-wrap'))document.getElementById('widgetMenu').classList.remove('open');
});
document.getElementById('addWidgetBtn').addEventListener('click',e=>{
  document.getElementById('widgetMenu').classList.toggle('open');
  e.stopPropagation();
});

if(Notification.permission==='default')Notification.requestPermission();

// ── BOOT
async function init(){
  widgets.forEach(w=>renderWidget(w));
  for(const sym of wl){
    await fetchQ(sym);buildTape();refreshAllWidgets(sym);
    await new Promise(r=>setTimeout(r,150));
  }
  await fetchQ(CUR);
  connectFinnhubWS();
}
init();
</script>
