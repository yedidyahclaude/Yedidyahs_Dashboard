<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Yedidyah's Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f;--s1:#0c0d1a;--s2:#11131f;--s3:#161829;
  --b1:#1c1f30;--b2:#2a2d44;
  --tx:#eef0fa;--mu:#8a8fae;--dim:#5a5f7a;
  --ac:#7c6aff;--ac2:#9d8fff;
  --gr:#19c48a;--rd:#f0506e;--gold:#f0b94f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;overflow:hidden}
input,button{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px}

/* ═══ LOGIN WALL ═══ */
#loginWall{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#15172c,var(--bg));display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{background:var(--s2);border:1px solid var(--b1);border-radius:16px;padding:36px;width:340px}
.login-box h1{font-size:20px;font-weight:800;margin-bottom:4px}
.login-box .sub{font-size:12px;color:var(--mu);margin-bottom:22px}
.login-box input{width:100%;background:var(--s1);border:1px solid var(--b2);border-radius:8px;color:var(--tx);padding:11px 12px;font-size:14px;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:var(--ac)}
.login-btn{width:100%;background:var(--ac);border:none;border-radius:8px;color:#fff;font-weight:700;font-size:14px;padding:12px;cursor:pointer;margin-top:6px}
.login-btn:disabled{opacity:.6}
.login-err{color:var(--rd);font-size:12px;margin-top:10px;display:none}
.login-msg{font-size:12px;margin-top:10px;display:none}
.login-switch{text-align:center;font-size:12px;color:var(--mu);margin-top:16px}
.login-switch a{color:var(--ac2);cursor:pointer;text-decoration:none}

/* ═══ MAIN APP ═══ */
#mainApp{display:none;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0}
.brand{font-size:16px;font-weight:800;white-space:nowrap}
.brand span{color:var(--ac2)}
#si{flex:1;max-width:420px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;color:var(--tx);padding:8px 12px;font-size:13px;outline:none}
#si:focus{border-color:var(--ac)}
.sess{font-size:10px;font-weight:700;padding:4px 9px;border-radius:5px;letter-spacing:.04em}
.sess.pre{background:#f0b94f22;color:var(--gold)}
.sess.mkt{background:#19c48a22;color:var(--gr)}
.sess.aft{background:#7c6aff22;color:var(--ac2)}
.sess.cls{background:#5a5f7a22;color:var(--dim)}
#htime{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace}
.tb-btn{background:none;border:1px solid var(--b2);border-radius:7px;color:var(--mu);font-size:12px;padding:7px 12px;cursor:pointer}
.tb-btn:hover{color:var(--tx);border-color:var(--ac)}

.main{flex:1;min-height:0;display:flex;flex-direction:column}
.scanner-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px;gap:10px}
.scan-hdr{display:flex;align-items:center;justify-content:space-between}
.scan-hdr h2{font-size:15px;font-weight:700}
.scan-status{font-size:11px;color:var(--dim)}
.scan-filters{display:flex;gap:10px;flex-wrap:wrap;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:10px 12px}
.flt-g{display:flex;flex-direction:column;gap:3px}
.flt-l{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.flt-i{width:64px;background:var(--s1);border:1px solid var(--b2);border-radius:6px;color:var(--tx);padding:5px 7px;font-size:12px;outline:none}
.scan-add{display:flex;gap:6px}
.scan-add input{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:8px;color:var(--tx);padding:9px 12px;font-size:13px;outline:none;text-transform:uppercase}
.scan-add input:focus{border-color:var(--ac)}
.scan-add button{background:var(--ac);border:none;border-radius:8px;color:#fff;font-weight:700;padding:9px 16px;cursor:pointer;font-size:13px}
.scan-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--s3);border:1px solid var(--b2);border-radius:12px;padding:3px 9px;font-size:11px;color:var(--mu)}
.tag button{background:none;border:none;color:var(--rd);cursor:pointer;font-size:12px;opacity:.6;line-height:1}

.scan-list{flex:1;min-height:0;overflow-y:auto;background:var(--s2);border:1px solid var(--b1);border-radius:10px}
.scan-empty{text-align:center;padding:50px 20px;color:var(--mu)}
.scan-empty .ic{font-size:30px;margin-bottom:10px}
.scan-empty .t{font-weight:700;color:var(--tx);margin-bottom:5px}
.scan-empty .d{font-size:12px;line-height:1.6}

.scan-row{display:grid;grid-template-columns:1fr 70px 70px auto 56px;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--b1);cursor:pointer;transition:background .15s}
.scan-row:hover{background:var(--s3)}
.scan-row:last-child{border-bottom:none}
.scan-sym{font-weight:700;font-size:13px}
.scan-sym.up{color:var(--gr)}.scan-sym.dn{color:var(--rd)}
.scan-px{font-family:'DM Mono',monospace;font-size:12px;color:var(--mu);text-align:right}
.scan-chg{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;text-align:right}
.scan-chg.up{color:var(--gr)}.scan-chg.dn{color:var(--rd)}
.scan-pills{display:flex;gap:3px}
.pill{font-size:8px;font-weight:700;padding:2px 5px;border-radius:3px;background:var(--s1);color:var(--dim);letter-spacing:.02em}
.pill.pass{background:#19c48a22;color:var(--gr)}
.pill.fail{background:#f0506e22;color:var(--rd)}
.pill.na{background:var(--s1);color:var(--dim)}
.scan-score{font-size:12px;font-weight:800;text-align:right}
.scan-row.score5 .scan-score{color:var(--gr)}
.scan-row.score4 .scan-score{color:var(--gold)}
.scan-row-new{animation:flashNew 1.6s ease-out}
@keyframes flashNew{0%{background:#7c6aff33}100%{background:transparent}}

/* ═══ BOTTOM CHART PANEL ═══ */
.chart-panel{flex-shrink:0;background:var(--s1);border-top:1px solid var(--b1);display:flex;align-items:center;gap:14px;padding:10px 16px;cursor:pointer}
.chart-panel .cp-sym{font-size:15px;font-weight:800;min-width:60px}
.chart-panel .cp-px{font-family:'DM Mono',monospace;font-size:13px}
.chart-panel .cp-chg{font-family:'DM Mono',monospace;font-size:13px;font-weight:700}
.up{color:var(--gr)}.dn{color:var(--rd)}
.cp-label{flex:1;font-size:11px;color:var(--dim)}
.cp-pop{background:var(--ac);border:none;border-radius:7px;color:#fff;font-weight:700;font-size:12px;padding:7px 14px;cursor:pointer}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--b2);border-radius:8px;padding:10px 16px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
</style>
</head>
<body>

<div id="loginWall">
  <div class="login-box">
    <div id="loginForm" style="display:flex;flex-direction:column">
      <h1>Yedidyah's Dashboard</h1>
      <div class="sub">Sign in to continue</div>
      <input id="loginEmail" type="email" placeholder="Email" autocomplete="username"/>
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryLogin()"/>
      <button class="login-btn" id="loginBtn" onclick="tryLogin()">Sign In →</button>
      <div class="login-err" id="loginErr"></div>
      <div class="login-switch">No account? <a onclick="showSignup()">Create one</a></div>
    </div>
    <div id="signupForm" style="display:none;flex-direction:column">
      <h1>Create Account</h1>
      <div class="sub">Requires admin approval before access</div>
      <input id="regEmail" type="email" placeholder="Email" autocomplete="username"/>
      <input id="regPass" type="password" placeholder="Password (min 6 characters)" autocomplete="new-password"/>
      <button class="login-btn" onclick="trySignup()">Create Account</button>
      <div class="login-msg" id="regMsg"></div>
      <div class="login-switch"><a onclick="showLogin()">← Back to sign in</a></div>
    </div>
  </div>
</div>

<div id="mainApp">
  <div class="topbar">
    <div class="brand">Yedidyah's <span>Dashboard</span></div>
    <input id="si" type="text" placeholder="Search any stock — press Enter" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter'){const s=this.value.trim();if(s){this.value='';selectSym(s);}}"/>
    <span class="sess cls" id="sessbdg">—</span>
    <span id="htime"></span>
    <button class="tb-btn" onclick="logout()">Sign Out</button>
  </div>

  <div class="main">
    <div class="scanner-wrap">
      <div class="scan-hdr">
        <h2>🎯 5 Pillars Scanner</h2>
        <span class="scan-status" id="scanStatus">⚡ Starting…</span>
      </div>
      <div class="scan-filters">
        <div class="flt-g"><span class="flt-l">Min Price $</span><input class="flt-i" type="number" value="1" step="0.5" id="f-minp"/></div>
        <div class="flt-g"><span class="flt-l">Max Price $</span><input class="flt-i" type="number" value="20" id="f-maxp"/></div>
        <div class="flt-g"><span class="flt-l">Min % Change</span><input class="flt-i" type="number" value="10" id="f-chg"/></div>
      </div>
      <div class="scan-add">
        <input id="addSymInp" type="text" placeholder="Saw it on Webull? Type ticker to check P3 + P5…" onkeydown="if(event.key==='Enter')addScanSym()"/>
        <button onclick="addScanSym()">Check</button>
      </div>
      <div class="scan-tags" id="scanTags"></div>
      <div class="scan-list" id="scanList"></div>
    </div>

    <div class="chart-panel" id="chartPanel" onclick="openTVPopup()" style="display:none">
      <span class="cp-sym" id="cpSym">—</span>
      <span class="cp-px" id="cpPx">—</span>
      <span class="cp-chg" id="cpChg">—</span>
      <span class="cp-label" id="cpLabel">Click to pop out full chart →</span>
      <button class="cp-pop" onclick="event.stopPropagation();openTVPopup()">Pop Out ↗</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══ SUPABASE AUTH (unchanged from existing dashboard) ═══
const SUPA_URL='https://yklxpcatopitwjzutolj.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrbHhwY2F0b3BpdHdqenV0b2xqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MDYyMTEsImV4cCI6MjA5NjM4MjIxMX0.KJotgJpSLziUvdZkUb66tV7vZXPEfMOjGOij2-vmk6Q';
const sf=(p,o={})=>fetch(SUPA_URL+p,{...o,headers:{'apikey':SUPA_KEY,'Content-Type':'application/json',...(o.headers||{})}});
async function tryLogin(){
  const email=document.getElementById('loginEmail').value.trim(),pass=document.getElementById('loginPass').value.trim();
  const err=document.getElementById('loginErr'),btn=document.getElementById('loginBtn');
  if(!email||!pass){err.textContent='Please enter email and password.';err.style.display='block';return;}
  btn.textContent='Signing in…';btn.disabled=true;
  try{
    const r=await sf('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    if(!r.ok){err.textContent=d.error_description||'Invalid email or password.';err.style.display='block';btn.textContent='Sign In →';btn.disabled=false;return;}
    const pr=await sf('/rest/v1/profiles?select=approved&id=eq.'+d.user.id,{headers:{'Authorization':'Bearer '+d.access_token}});
    const prof=await pr.json();
    if(!prof?.[0]?.approved){err.textContent='Your account is pending admin approval.';err.style.display='block';btn.textContent='Sign In →';btn.disabled=false;return;}
    sessionStorage.setItem('sv_token',d.access_token);sessionStorage.setItem('sv_uid',d.user.id);sessionStorage.setItem('sv_email',d.user.email);
    showApp();
  }catch(e){err.textContent='Connection error. Try again.';err.style.display='block';btn.textContent='Sign In →';btn.disabled=false;}
}
async function trySignup(){
  const email=document.getElementById('regEmail').value.trim(),pass=document.getElementById('regPass').value.trim();
  const msg=document.getElementById('regMsg');
  if(!email||!pass){msg.style.color='#f0506e';msg.textContent='Please fill in all fields.';msg.style.display='block';return;}
  if(pass.length<6){msg.style.color='#f0506e';msg.textContent='Password must be at least 6 characters.';msg.style.display='block';return;}
  try{
    const r=await sf('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    if(!r.ok){msg.style.color='#f0506e';msg.textContent=d.error_description||'Signup failed.';msg.style.display='block';return;}
    if(d.user?.id)await sf('/rest/v1/profiles',{method:'POST',headers:{'Authorization':'Bearer '+d.access_token,'Prefer':'return=minimal'},body:JSON.stringify({id:d.user.id,email,approved:false})});
    msg.style.color='#19c48a';msg.textContent='Account created! Awaiting admin approval.';msg.style.display='block';
    setTimeout(()=>showLogin(),4000);
  }catch(e){msg.style.color='#f0506e';msg.textContent='Connection error.';msg.style.display='block';}
}
function showSignup(){document.getElementById('loginForm').style.display='none';document.getElementById('signupForm').style.display='flex';}
function showLogin(){document.getElementById('signupForm').style.display='none';document.getElementById('loginForm').style.display='flex';document.getElementById('loginErr').style.display='none';}
function showApp(){document.getElementById('loginWall').style.display='none';document.getElementById('mainApp').style.display='flex';setTimeout(init,50);}
function checkAuth(){if(sessionStorage.getItem('sv_token')){showApp();return true;}document.getElementById('loginWall').style.display='flex';return false;}
function logout(){sessionStorage.clear();location.reload();}

// ═══ FINNHUB KEY — paste your real key here before using ═══
const FHK='d8gla1pr01qlgcuk91o0d8gla1pr01qlgcuk91og';

// ═══ STATE ═══
let Q={};                 // symbol -> live quote data
let scanSyms=JSON.parse(localStorage.getItem('sv_scan')||'[]');
let scanCache={};         // symbol -> {p3,p4,p5,hasNews,ts,rvolValue,floatValue}
let newSyms=new Map();    // symbol -> timestamp added (for "NEW" flash)
let appReady=false;
let curChartSym=null;
let scanDeepRunning=false;
let fhWS=null;

// ═══ SESSION / CLOCK ═══
function getSession(){
  const et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const m=et.getHours()*60+et.getMinutes(),d=et.getDay();
  if(d===0||d===6)return'cls';
  if(m>=240&&m<570)return'pre';if(m>=570&&m<960)return'mkt';if(m>=960&&m<1200)return'aft';return'cls';
}
function tick(){
  const et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const p=n=>String(n).padStart(2,'0');
  document.getElementById('htime').textContent=`${p(et.getHours())}:${p(et.getMinutes())}:${p(et.getSeconds())} ET`;
  const sess=getSession();const labels={pre:'PRE-MARKET',mkt:'MARKET OPEN',aft:'AFTER HOURS',cls:'CLOSED'};
  const el=document.getElementById('sessbdg');if(el){el.textContent=labels[sess];el.className='sess '+sess;}
}
setInterval(tick,1000);tick();

// ═══ UTILITIES ═══
function fmtP(p){return p?parseFloat(p).toFixed(2):'—';}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',3500);}
function playPing(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(880,ctx.currentTime);o.frequency.setValueAtTime(1100,ctx.currentTime+0.08);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);o.start(ctx.currentTime);o.stop(ctx.currentTime+0.3);}catch(e){}}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
const debouncedScanUpdate=debounce(()=>liveScanUpdate(),300);

// ═══ FINNHUB API — queued at ~1.2s/call to respect free-tier rate limit ═══
const apiQueue=[];let apiRunning=false;
function queueCall(fn){return new Promise((resolve,reject)=>{apiQueue.push({fn,resolve,reject});if(!apiRunning)drainQueue();});}
async function drainQueue(){if(apiRunning)return;apiRunning=true;while(apiQueue.length){const{fn,resolve,reject}=apiQueue.shift();try{resolve(await fn());}catch(e){reject(e);}if(apiQueue.length)await new Promise(r=>setTimeout(r,1200));}apiRunning=false;}
const _badSyms={}; // sym -> timestamp of last 403/429, backs off retrying for 5min
async function fetchQDirect(sym){
  if(Q[sym]?.price&&Date.now()-(Q[sym]._ts||0)<25000)return;
  if(_badSyms[sym]&&Date.now()-_badSyms[sym]<300000)return;
  return queueCall(async()=>{
    try{const r=await fetch('https://finnhub.io/api/v1/quote?symbol='+sym+'&token='+FHK);if(r.status===429||r.status===403){_badSyms[sym]=Date.now();return;}const q=await r.json();if(q.c)Q[sym]={symbol:sym,price:q.c,open:q.o,high:q.h,low:q.l,prevClose:q.pc,change:q.c-q.pc,changePct:q.pc?(q.c-q.pc)/q.pc*100:0,volume:q.v||0,name:Q[sym]?.name||sym,_ts:Date.now()};}catch(e){}
  });
}
async function fetchQ(sym){if(Q[sym]?.price&&Date.now()-(Q[sym]._ts||0)<25000)return;await fetchQDirect(sym);}
function connectFinnhubWS(){
  const syms=[...new Set(scanSyms)];
  try{
    fhWS=new WebSocket('wss://ws.finnhub.io?token='+FHK);
    fhWS.onopen=()=>syms.forEach(s=>fhWS.send(JSON.stringify({type:'subscribe',symbol:s})));
    fhWS.onmessage=e=>{const msg=JSON.parse(e.data);if(msg.type==='trade'&&msg.data){msg.data.forEach(t=>{const sym=t.s,px=t.p;if(!Q[sym])return;const prev=Q[sym].prevClose||px;Q[sym]={...Q[sym],price:px,change:px-prev,changePct:prev?(px-prev)/prev*100:0,high:Math.max(Q[sym].high||px,px),low:Math.min(Q[sym].low||px,px)};});debouncedScanUpdate();updateCPPrice();}};
    fhWS.onclose=()=>setTimeout(connectFinnhubWS,5000);fhWS.onerror=()=>fhWS.close();
  }catch(e){}
}

// ═══ SYMBOL SELECTION (search bar + scanner click + quick-check) ═══
async function selectSym(sym){
  sym=sym.toUpperCase().trim();if(!sym)return;
  curChartSym=sym;
  if(!Q[sym])await fetchQDirect(sym);
  if(!scanSyms.includes(sym)){scanSyms.push(sym);saveScanSyms();newSyms.set(sym,Date.now());playPing();showToast('📈 '+sym+' added to 5 Pillars Scanner');if(fhWS?.readyState===1)fhWS.send(JSON.stringify({type:'subscribe',symbol:sym}));}
  liveScanUpdate();
  openChartPanel(sym);
  setTimeout(startDeepScan,200);
}
function saveScanSyms(){localStorage.setItem('sv_scan',JSON.stringify(scanSyms));}
function addScanSym(){
  const inp=document.getElementById('addSymInp');const sym=inp.value.toUpperCase().trim();if(!sym)return;
  inp.value='';selectSym(sym);
}
function rmScanSym(sym){scanSyms=scanSyms.filter(s=>s!==sym);saveScanSyms();delete scanCache[sym];liveScanUpdate();}

// ═══ 5 PILLARS SCANNER RENDER ═══
function renderScanTags(){
  document.getElementById('scanTags').innerHTML=scanSyms.map(s=>
    '<span class="tag">'+s+'<button onclick="rmScanSym(\''+s+'\')">×</button></span>'
  ).join('');
}
function liveScanUpdate(){
  renderScanTags();
  const list=document.getElementById('scanList');
  const minP=parseFloat(document.getElementById('f-minp').value)||1;
  const maxP=parseFloat(document.getElementById('f-maxp').value)||20;
  const minC=parseFloat(document.getElementById('f-chg').value)||10;
  const results=[];
  scanSyms.forEach(sym=>{
    const q=Q[sym];if(!q?.price)return;
    const p1=q.price>=minP&&q.price<=maxP,p2=(q.changePct||0)>=minC;
    const c=scanCache[sym]||{};
    const score=[p1,p2,c.p3===true,c.p4===true,c.p5===true].filter(Boolean).length;
    results.push({sym,q,p1,p2,p3:c.p3,p4:c.p4,p5:c.p5,score,hasNews:c.hasNews||false});
  });
  if(!results.length){
    list.innerHTML='<div class="scan-empty"><div class="ic">🎯</div><div class="t">No symbols yet</div><div class="d">Search a stock above, or type a Webull ticker below to check it.</div></div>';
    return;
  }
  results.sort((a,b)=>{
    const aT=newSyms.get(a.sym)||0,bT=newSyms.get(b.sym)||0;
    if(aT||bT)return bT-aT;
    if(b.score!==a.score)return b.score-a.score;
    return (b.q.changePct||0)-(a.q.changePct||0);
  });
  const pd=v=>v===true?'pass':v===false?'fail':'na';
  list.innerHTML=results.map(r=>{
    const u=(r.q.changePct||0)>=0;
    const sc=r.score>=5?'score5':r.score>=4?'score4':'';
    const isNew=newSyms.has(r.sym);
    const pending=r.p3===null||r.p4===null||r.p5===null;
    const scoreLabel=r.score+'/5'+(pending?'+':'');
    return '<div class="scan-row '+sc+(isNew?' scan-row-new':'')+'" onclick="selectSym(\''+r.sym+'\')">'
      +'<span class="scan-sym '+(u?'up':'dn')+'">'+r.sym+(r.hasNews?' 🔥':'')+'</span>'
      +'<span class="scan-px">$'+fmtP(r.q.price)+'</span>'
      +'<span class="scan-chg '+(u?'up':'dn')+'">'+(u?'+':'')+((r.q.changePct||0).toFixed(1))+'%</span>'
      +'<div class="scan-pills"><span class="pill '+pd(r.p1)+'">P1</span><span class="pill '+pd(r.p2)+'">P2</span><span class="pill '+(pending?'na':pd(r.p3))+'">P3</span><span class="pill '+(pending?'na':pd(r.p4))+'">P4</span><span class="pill '+(pending?'na':pd(r.p5))+'">P5</span></div>'
      +'<span class="scan-score">'+scoreLabel+'</span>'
      +'</div>';
  }).join('');
}

// ═══ DEEP SCAN — P3 (news) + P4 (RVOL) + P5 (float) ═══
async function startDeepScan(){
  if(!appReady||scanDeepRunning)return;scanDeepRunning=true;
  document.getElementById('scanStatus').textContent='⚡ Scanning…';
  const sess=getSession();const rvThreshold=sess==='pre'?2:sess==='aft'?1.5:5;const minC=sess==='pre'||sess==='aft'?5:10;
  const etNow=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));const mktOpen=new Date(etNow);mktOpen.setHours(9,30,0,0);const minsElapsed=sess==='mkt'?Math.max(1,(etNow-mktOpen)/60000):390;
  for(const sym of scanSyms){
    try{
      if(!Q[sym])await fetchQ(sym);const q=Q[sym];if(!q?.price)continue;
      const p1=q.price>=1&&q.price<=20,p2=(q.changePct||0)>=minC;if(!p1||!p2)continue;
      const cached=scanCache[sym]||{};if(Date.now()-(cached.ts||0)<120000)continue;
      let hasNews=cached.hasNews??false,p3=cached.p3??null,p4=cached.p4??null,p5=cached.p5??null;
      await queueCall(async()=>{try{const today=new Date().toISOString().split('T')[0];const from=new Date(Date.now()-2*86400000).toISOString().split('T')[0];const r=await fetch('https://finnhub.io/api/v1/company-news?symbol='+sym+'&from='+from+'&to='+today+'&token='+FHK);if(r.status===403||r.status===429){p3=null;return;}const news=await r.json();hasNews=Array.isArray(news)&&news.length>0;p3=hasNews;}catch(e){p3=null;}});
      await queueCall(async()=>{try{
        const r=await fetch('https://finnhub.io/api/v1/stock/metric?symbol='+sym+'&metric=all&token='+FHK);
        if(r.status===403||r.status===429){p4=null;p5=null;return;}
        const d=await r.json();const m=d.metric||{};
        // Finnhub's 10DayAverageTradingVolume is in MILLIONS of shares — must
        // multiply by 1e6 before dividing into raw quote.volume.
        const avgDailyVol=(m['10DayAverageTradingVolume']||0)*1e6;
        if(avgDailyVol>0){const normalizedRVol=(q.volume/avgDailyVol)*(390/minsElapsed);p4=normalizedRVol>=rvThreshold;scanCache[sym]={...scanCache[sym],rvolValue:normalizedRVol.toFixed(1)};}
        else{p4=(q.changePct||0)>=20;scanCache[sym]={...scanCache[sym],rvolValue:'est'};}
        const trueFloat=m['shareFloat']??m['float']??null;
        if(trueFloat!==null){const floatM=trueFloat>1000?trueFloat/1e6:trueFloat;p5=floatM<10;scanCache[sym]={...scanCache[sym],floatValue:floatM.toFixed(1)+'M'};}
        else{p5=null;scanCache[sym]={...scanCache[sym],floatValue:'—'};}
      }catch(e){p4=null;p5=null;}});
      scanCache[sym]={...scanCache[sym],p3,p4,p5,hasNews,ts:Date.now()};
    }catch(e){}
  }
  scanDeepRunning=false;
  const now=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('scanStatus').textContent='⚡ Last scan: '+now;
  liveScanUpdate();
}
let deepScanCountdown=30;
setInterval(async()=>{
  deepScanCountdown--;
  if(deepScanCountdown<=0){deepScanCountdown=30;await startDeepScan();}
  else{const el=document.getElementById('scanStatus');if(el&&!scanDeepRunning)el.textContent='⚡ Next scan in '+deepScanCountdown+'s';}
},1000);

['f-minp','f-maxp','f-chg'].forEach(id=>{
  document.addEventListener('DOMContentLoaded',()=>{
    const el=document.getElementById(id);if(el)el.addEventListener('input',()=>liveScanUpdate());
  });
});

// ═══ BOTTOM CHART PANEL + TRADINGVIEW POP-OUT (unchanged logic) ═══
function openChartPanel(sym){
  let tvSym=sym;if(sym==='BTC/USD')tvSym='BINANCE:BTCUSDT';else if(sym==='ETH/USD')tvSym='BINANCE:ETHUSDT';
  curChartSym=sym;
  document.getElementById('chartPanel').style.display='flex';
  document.getElementById('cpSym').textContent=sym;
  document.getElementById('cpLabel').textContent='Click to pop out full chart →';
  updateCPPrice();
}
function updateCPPrice(){
  if(!curChartSym)return;const q=Q[curChartSym];if(!q)return;
  const u=(q.changePct||0)>=0;
  const px=document.getElementById('cpPx'),chg=document.getElementById('cpChg');
  if(px){px.textContent='$'+fmtP(q.price);px.className='cp-px '+(u?'up':'dn');}
  if(chg){chg.textContent=(u?'+':'')+(q.changePct||0).toFixed(2)+'%';chg.className='cp-chg '+(u?'up':'dn');}
}
// User's own saved TradingView layout — a 3-pane chart with each pane set to
// a different interval. Navigate TO this exact chart ID every time instead
// of generating a fresh throwaway chart, so the saved layout and per-pane
// intervals survive across every POP OUT click. Reuse the SAME window via
// location.href — never close/recreate it and never use &clear=1.
const SAVED_LAYOUT_ID='7ghMFdhC';
let _tvWin=null;
function openTVPopup(){
  if(!curChartSym){showToast('Select a stock first');return;}
  let tvSym=curChartSym;if(curChartSym==='BTC/USD')tvSym='BINANCE:BTCUSDT';else if(curChartSym==='ETH/USD')tvSym='BINANCE:ETHUSDT';
  const base='https://www.tradingview.com/chart/'+SAVED_LAYOUT_ID+'/?symbol='+encodeURIComponent(tvSym);
  const sw=screen.availWidth,sh=screen.availHeight;const cw=Math.floor(sw*0.9),ch=Math.floor(sh*0.9);const ol=Math.floor((sw-cw)/2),ot=Math.floor((sh-ch)/2);
  const feat='width='+cw+',height='+ch+',left='+ol+',top='+ot+',resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no';
  if(_tvWin&&!_tvWin.closed){_tvWin.location.href=base;_tvWin.focus();}
  else{_tvWin=window.open(base,'tvChartWin',feat);}
}

// ═══ INIT ═══
async function init(){
  renderScanTags();liveScanUpdate();
  connectFinnhubWS();
  const toFetch=scanSyms.filter(s=>!Q[s]?.price);
  for(const sym of toFetch){await fetchQDirect(sym);await new Promise(r=>setTimeout(r,1100));}
  appReady=true;liveScanUpdate();
  setTimeout(startDeepScan,3000);
  setInterval(()=>{if(appReady)liveScanUpdate();},15000);
}

// Defeats iOS bfcache restoring a frozen old snapshot of the page.
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
if(checkAuth())init();
</script>
